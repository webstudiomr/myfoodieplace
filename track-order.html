<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a81725"><meta name="referrer" content="no-referrer"><title>Track your order | Foodie Place</title><link rel="stylesheet" href="style.css"></head>
<body class="track-page"><header class="track-header"><div class="track-header-inner"><a class="track-logo" href="index.html">♨ Foodie Place</a><nav><a href="index.html">Home</a><a href="menu.html">Full Menu</a><a id="trackWhatsApp" href="#" target="_blank" rel="noopener" style="display:none">WhatsApp</a></nav></div></header>
<main class="track-wrap"><section class="track-card"><div class="track-eyebrow">Order updates</div><h1>Track your order</h1><p class="track-intro">Enter the private tracking code shown after your order is placed. Only someone with this code can view the order status.</p>
<form class="track-form" id="trackForm"><input id="phone" type="text" inputmode="text" maxlength="32" minlength="32" pattern="[a-fA-F0-9]{32}" autocomplete="off" placeholder="Paste your 32-character tracking code" title="Enter the 32-character private tracking code." required><button id="trackButton" type="submit">Show my orders</button></form><p class="track-note">Your private tracking code is included in your order confirmation. Keep it safe.</p>
<div id="trackMessage" class="track-message" role="status" aria-live="polite"></div><div id="trackOrders" class="track-orders"></div><div class="track-footer" id="lastUpdated"></div></section></main>
<script>(function(){const form=document.getElementById("trackForm"),phoneInput=document.getElementById("phone"),message=document.getElementById("trackMessage"),list=document.getElementById("trackOrders"),button=document.getElementById("trackButton"),updated=document.getElementById("lastUpdated");let refreshTimer=null,activePhone="";phoneInput.addEventListener("input",()=>{phoneInput.value=phoneInput.value.replace(/[^a-fA-F0-9]/g,"").slice(0,32)});const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=v=>"Rs. "+Number(v||0).toLocaleString("en-PK");function progress(s){if(s==="Cancelled")return -1;return ({Pending:0,Preparing:1,Ready:2,Delivered:3})[s]??0}function render(orders){if(!orders.length){list.innerHTML="";message.textContent="No order was found for this tracking code. Check the code and try again.";updated.textContent="";return}message.textContent=orders.length===1?"Your order status is shown below.":"Your recent orders are shown below.";list.innerHTML=orders.map(o=>{const p=progress(o.status),steps=["Pending","Preparing","Ready","Delivered"];return '<article class="track-order"><div class="track-order-top"><h2>Order '+safe(o.id)+'</h2><span class="track-status '+safe(String(o.status).toLowerCase())+'">'+safe(o.status)+'</span></div><div class="track-meta">Placed: '+safe(o.date?new Date(o.date).toLocaleString():"—")+'<br>Total: '+safe(money(o.total))+'</div>'+(p<0?'<p class="track-meta">This order was cancelled.</p>':'<div class="track-progress">'+steps.map((s,i)=>'<span class="'+(i<=p?"done":"")+'"></span>').join("")+'</div>')+'</article>'}).join("");updated.textContent="Auto-refreshes every 15 seconds · Last checked "+new Date().toLocaleTimeString()}async function load(show){if(!activePhone)return;if(show){button.disabled=true;button.textContent="Checking…";message.textContent="Looking up your orders…"}try{const r=await fetch("/api/track-order?token="+encodeURIComponent(activePhone),{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"Could not load orders.");render(d.orders||[])}catch(e){message.textContent=e.message||"Could not load order status."}finally{if(show){button.disabled=false;button.textContent="Show my orders"}}}form.addEventListener("submit",e=>{e.preventDefault();if(!phoneInput.checkValidity()){phoneInput.reportValidity();return}activePhone=phoneInput.value.toLowerCase();clearInterval(refreshTimer);load(true);refreshTimer=setInterval(()=>load(false),15000)});const token=new URLSearchParams(location.search).get("token");if(token){phoneInput.value=token.toLowerCase();form.requestSubmit()}})();fetch("/api/settings").then(r=>r.json()).then(d=>{const n=String(d.settings?.whatsapp_phone||"").replace(/\D/g,"");const a=document.getElementById("trackWhatsApp");if(n){a.href="https://wa.me/"+n+"?text="+encodeURIComponent("Assalam-o-Alaikum! I need help with my Foodie Place order.");a.style.display="inline"}}).catch(()=>{});</script></body></html>
